<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Radio Edition</title>
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-bg: #f2f2f7;
            --radio-border: #d1d1d6;
        }

        body {
            background-color: #e5e5ea;
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .iphone-frame {
            background: #fff;
            width: 350px;
            padding: 25px;
            border-radius: 45px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            text-align: center;
        }

        .dynamic-island {
            width: 110px;
            height: 28px;
            background: #000;
            border-radius: 20px;
            margin: 0 auto 25px;
        }

        .roulette-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Wou Deyò (Normal) */
        .wheel-outer {
            position: absolute;
            width: 310px;
            height: 310px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid #efeff4;
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* Wou Mitan (Glass) */
        .wheel-inner {
            position: absolute;
            width: 185px;
            height: 185px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0,0,0,0.05);
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
            z-index: 2;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .number {
            position: absolute;
            left: 50%; top: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Chif Deyò (Minimal) */
        .outer-num { 
            color: #1c1c1e; 
            font-size: 14px; 
            font-weight: 500;
        }

        /* STYLE BOUTON RADIO POU MILTIPLIKATÈ */
        .radio-node {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1.5px solid var(--radio-border);
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 8.5px;
            font-weight: 700;
            color: #8e8e93;
            transition: all 0.3s ease;
        }

        /* Lè miltiplikatè a chwazi (efè vizyèl) */
        .radio-node.active {
            border-color: var(--ios-blue);
            color: var(--ios-blue);
            background: rgba(0, 122, 255, 0.1);
        }

        .indicator {
            position: absolute;
            top: -15px;
            z-index: 20;
            width: 3px;
            height: 25px;
            background: var(--ios-blue);
            border-radius: 4px;
        }

        .controls { margin-top: 35px; }

        input {
            border: none;
            background: #f2f2f7;
            padding: 12px;
            border-radius: 12px;
            width: 60px;
            font-size: 18px;
            text-align: center;
            outline: none;
        }

        button {
            background-color: var(--ios-blue);
            color: white;
            border: none;
            padding: 15px 70px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.97); opacity: 0.9; }

        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #8e8e93;
            letter-spacing: -0.2px;
        }
    </style>
</head>
<body>

    <div class="iphone-frame">
        <div class="dynamic-island"></div>
        <h3 style="font-weight: 700; margin: 0; color: #1c1c1e;">Roulette Studio</h3>
        
        <div class="roulette-container">
            <div class="indicator"></div>
            <div class="wheel-outer" id="wheelO"></div>
            <div class="wheel-inner" id="wheelI"></div>
        </div>

        <div class="controls">
            <input type="number" id="chwa" value="7" min="1" max="32">
            <br>
            <button onclick="vireiOS()">Spin</button>
            <div id="status">Tap Spin to start</div>
        </div>
    </div>

    <script>
        const total = 32;
        const deg = 360 / total;

        // Kreye Chif Deyò yo
        for(let i = 0; i < total; i++) {
            let n = document.createElement('div');
            n.className = 'number outer-num';
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 132 * Math.cos(angleRad);
            let y = 132 * Math.sin(angleRad);
            n.innerText = i + 1;
            n.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            document.getElementById('wheelO').appendChild(n);
        }

        // Kreye Bouton Radio pou Miltiplikatè yo
        for(let i = 0; i < total; i++) {
            let container = document.createElement('div');
            container.className = 'number';
            
            let radio = document.createElement('div');
            radio.className = 'radio-node';
            radio.id = 'radio-' + i;
            radio.innerText = i;
            
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 72 * Math.cos(angleRad);
            let y = 72 * Math.sin(angleRad);
            
            container.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            container.appendChild(radio);
            document.getElementById('wheelI').appendChild(container);
        }

        let rotO = 0; let rotI = 0;

        function vireiOS() {
            // Netwaye ansyen miltiplikatè ki te aktif la
            document.querySelectorAll('.radio-node').forEach(el => el.classList.remove('active'));

            const resO = Math.floor(Math.random() * total);
            const resI = Math.floor(Math.random() * total);
            
            document.getElementById('status').innerText = "Spinning...";

            rotO += 1440 + (360 - (resO * deg));
            document.getElementById('wheelO').style.transform = `rotate(${rotO}deg)`;

            setTimeout(() => {
                rotI -= (1440 + (180 + (resI * deg)));
                document.getElementById('wheelI').style.transform = `rotate(${rotI}deg)`;
                
                setTimeout(() => {
                    // Limen bouton radio ki genyen an
                    document.getElementById('radio-' + resI).classList.add('active');
                    document.getElementById('status').innerHTML = `Win: <b>${resO + 1}</b> • Multiplier: <b>x${resI}</b>`;
                }, 5000);
            }, 800);
        }
    </script>
</body>
</html>
