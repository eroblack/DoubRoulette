<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Metal Roulette</title>
    <style>
        body {
            background: radial-gradient(circle, #2c3e50, #000);
            color: #ecf0f1;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
            overflow: hidden;
        }

        .roulette-container {
            position: relative;
            width: 380px;
            height: 380px;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Rebò Metalik 3D */
            border: 8px solid #7f8c8d;
            border-radius: 50%;
            background: conic-gradient(#bdc3c7, #7f8c8d, #bdc3c7, #2c3e50, #bdc3c7);
            box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 60px rgba(0,0,0,0.5);
        }

        /* Egwi Metalik (Chrome) */
        .indicator-top {
            position: absolute;
            top: -15px;
            z-index: 100;
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #e74c3c;
            filter: drop-shadow(0 2px 5px #000);
        }

        /* Roulo Deyò (Bwose Metal) */
        .wheel-outer {
            position: absolute;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: radial-gradient(circle, #95a5a6 0%, #2c3e50 100%);
            border: 4px solid #bdc3c7;
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
        }

        /* Roulo Mitan (Chrome Fonse) */
        .wheel-inner {
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #34495e, #000);
            border: 4px solid #ecf0f1;
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
            z-index: 2;
        }

        /* Boul Bi Asye (Steel Balls) */
        .bi {
            position: absolute;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 19px;
            left: 50%;
            top: 50%;
            color: #333;
            /* Efè Chrome Refleksyon */
            background: radial-gradient(circle at 30% 30%, #ffffff, #bdc3c7 50%, #7f8c8d 100%);
            box-shadow: 2px 4px 8px rgba(0,0,0,0.6), inset -2px -2px 5px rgba(255,255,255,0.5);
        }

        /* Boul Miltiplikatè (Kòiv/Gold Metal) */
        .bi-metal {
            width: 32px;
            height: 32px;
            font-size: 14px;
            background: radial-gradient(circle at 30% 30%, #f1c40f, #f39c12 60%, #d35400);
            color: #000;
        }

        .controls { margin-top: 25px; }

        button {
            background: linear-gradient(#bdc3c7, #2c3e50);
            color: white;
            padding: 15px 40px;
            border-radius: 5px;
            border: 2px solid #ecf0f1;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 0 #000;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-1px, -2px) rotate(-1deg); }
            40% { transform: translate(-3px, 0px) rotate(1deg); }
            60% { transform: translate(3px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -1px) rotate(-1deg); }
        }

        .active-roll { animation: shake 0.15s infinite; }
    </style>
</head>
<body>

    <h2 style="color:#bdc3c7; text-shadow: 2px 2px #000;">METAL BI ROLLER</h2>

    <div class="roulette-container" id="roller">
        <div class="indicator-top"></div>
        
        <div class="wheel-outer" id="wheelO"></div>
        <div class="wheel-inner" id="wheelI"></div>
    </div>

    <div class="controls">
        <input type="number" id="chwa" value="10" style="padding:10px; background:#000; color:#00ff00; border:1px solid #7f8c8d; width:60px; font-size:20px; text-align:center;">
        <br><br>
        <button id="spinBtn" onclick="vireMetal()">Lanse Bi Asye yo</button>
    </div>

    <div id="status" style="margin-top:20px; font-size:18px; font-family: monospace;">Sistèm pare...</div>

    <script>
        const total = 32;
        const deg = 360 / total;

        // Boul Asye Deyò
        for(let i = 0; i < total; i++) {
            let bi = document.createElement('div');
            bi.className = 'bi';
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 142 * Math.cos(angleRad);
            let y = 142 * Math.sin(angleRad);
            bi.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            bi.innerText = i + 1;
            document.getElementById('wheelO').appendChild(bi);
        }

        // Boul Metalik Mitan
        for(let i = 0; i < total; i++) {
            let bi = document.createElement('div');
            bi.className = 'bi bi-metal';
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 85 * Math.cos(angleRad);
            let y = 85 * Math.sin(angleRad);
            bi.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            bi.innerText = i;
            document.getElementById('wheelI').appendChild(bi);
        }

        let curO = 0; let curI = 0;

        function vireMetal() {
            const btn = document.getElementById('spinBtn');
            const roller = document.getElementById('roller');
            
            btn.disabled = true;
            roller.classList.add('active-roll');
            document.getElementById('status').innerText = "Wotasyon an kous...";

            const resO = Math.floor(Math.random() * total);
            const resI = Math.floor(Math.random() * total);

            curO += 1800 + (360 - (resO * deg));
            document.getElementById('wheelO').style.transform = `rotate(${curO}deg)`;

            setTimeout(() => {
                curI -= (1800 + (180 + (resI * deg)));
                document.getElementById('wheelI').style.transform = `rotate(${curI}deg)`;

                setTimeout(() => {
                    btn.disabled = false;
                    roller.classList.remove('active-roll');
                    document.getElementById('status').innerHTML = 
                    `Boul: <b style="color:#fff">${resO + 1}</b> | Milt: <b style="color:#f1c40f">X${resI}</b>`;
                }, 5000);
            }, 1200);
        }
    </script>
</body>
</html>
