<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pierre Lannier - Strategic Edition</title>
    <style>
        :root {
            --burgundy: #6b001a;
            --sunray: radial-gradient(circle, #8a1a2d 0%, #2b0008 100%);
            --silver: #e0e0e0;
        }

        body {
            background-color: #050505;
            color: var(--silver);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .watch-body {
            position: relative;
            width: 400px;
            height: 400px;
            background: linear-gradient(145deg, #2a2a2a, #000);
            border-radius: 50%;
            padding: 12px;
            border: 4px solid #1a1a1a;
            box-shadow: 0 50px 100px rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dial-plate {
            position: relative;
            width: 400px;
            height: 400px;
            background: var(--sunray);
            border-radius: 50%;
            overflow: hidden;
        }

        .needle-main {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 20px;
            background: #fff;
            z-index: 100;
            box-shadow: 0 0 10px #fff;
            border-radius: 2px;
        }

        .result-fixed-slot {
            position: absolute;
            z-index: 110;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: rgba(0,0,0,0.7);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            backdrop-filter: blur(10px);
        }

        .wheel-container {
            position: absolute;
            width: 400px;
            height: 400px;
            transition: transform 7s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .number-slot {
            position: absolute;
            left: 50%; top: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .num-white {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 500;
        }

        .text-index {
            font-size: 17px;
            font-weight: 950; /* Plis pwès toujou */
            color: rgba(255, 255, 255, 0.2);
            transition: all 0.4s ease;
            letter-spacing: 1px;
        }

        .text-index.winner {
            color: #fff;
            transform: scale(1.4);
            text-shadow: 0 0 25px #fff;
        }

        .btn-play {
            margin-top: 50px;
            background: #fff;
            color: #000;
            border: none;
            padding: 16px 80px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-play:active { transform: scale(0.95); }
        .btn-play:disabled { background: #333; color: #666; }
    </style>
</head>
<body>

    <div class="watch-body">
        <div class="needle-main"></div>
        <div class="result-fixed-slot" id="digitalDisplay">P</div>
        
        <div class="dial-plate">
            <div id="wheelO" class="wheel-container"></div>
            <div id="wheelI" class="wheel-container" style="width: 250px; height: 250px; left: 75px; top: 75px;"></div>
        </div>
    </div>

    <button class="btn-play" id="spinBtn" onclick="spinLuxe()">Vire</button>

    <script>
        // Lòd estratejik (Ordinary Roulette Order)
        const ordinaryOrder = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7];
        // Pou mitan an, nou itilize yon lòd estratejik diferan pou varyete
        const strategicMiddle = [10, 25, 0, 18, 5, 21, 14, 2, 29, 7, 30, 12, 3, 22, 9, 31, 1, 20, 15, 27, 6, 33, 11, 24, 16, 13, 19, 8, 23, 4, 28, 17];
        
        const total = ordinaryOrder.length;
        const deg = 360 / total;

        function format(n) { return n < 10 ? '0' + n : n; }

        // Jenere Chif Deyò (Lòd Roulette)
        for(let i = 0; i < total; i++) {
            let el = document.createElement('div');
            el.className = 'number-slot num-white';
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 175 * Math.cos(angleRad);
            let y = 175 * Math.sin(angleRad);
            el.innerText = format(ordinaryOrder[i]);
            el.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${i * deg}deg)`;
            document.getElementById('wheelO').appendChild(el);
        }

        // Jenere Chif Mitan (Lòd Estratejik & Pwès)
        for(let i = 0; i < total; i++) {
            let container = document.createElement('div');
            container.className = 'number-slot';
            let txt = document.createElement('div');
            txt.className = 'text-index';
            txt.id = 'mid-' + i;
            txt.innerText = format(strategicMiddle[i]);
            
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 95 * Math.cos(angleRad); 
            let y = 95 * Math.sin(angleRad);
            
            container.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${i * deg}deg)`;
            container.appendChild(txt);
            document.getElementById('wheelI').appendChild(container);
        }

        let rotO = 0; let rotI = 0;

        function spinLuxe() {
            document.querySelectorAll('.text-index').forEach(t => t.classList.remove('winner'));
            document.getElementById('digitalDisplay').innerText = "••";
            document.getElementById('spinBtn').disabled = true;
            
            const winIdxO = Math.floor(Math.random() * total);
            const winIdxI = Math.floor(Math.random() * total);

            rotO += 2880 + (360 - (winIdxO * deg));
            document.getElementById('wheelO').style.transform = `rotate(${rotO}deg)`;

            setTimeout(() => {
                rotI -= (2880 + (180 + (winIdxI * deg)));
                document.getElementById('wheelI').style.transform = `rotate(${rotI}deg)`;
                
                setTimeout(() => {
                    const winner = document.getElementById('mid-' + winIdxI);
                    winner.classList.add('winner');
                    document.getElementById('digitalDisplay').innerText = winner.innerText;
                    document.getElementById('spinBtn').disabled = false;
                }, 7000);
            }, 400);
        }
    </script>
</body>
</html>
