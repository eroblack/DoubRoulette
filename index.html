<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Roulette Pro 32</title>
    <style>
        body {
            background: radial-gradient(circle, #021128, #000511);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
        }

        h2 {
            color: #00ff00;
            text-shadow: 0 0 15px rgba(0, 255, 0, 0.6);
            margin-bottom: 2px;
            font-size: 24px;
        }

        .roulette-container {
            position: relative;
            width: 360px;
            height: 360px;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Egiy endikatè yo fiks anndan zòn jwèt la */
        .indicator-outer {
            position: absolute;
            top: 8px;
            z-index: 10;
            color: #ff0055;
            font-size: 26px;
            text-shadow: 0 0 10px #ff0055;
            font-weight: bold;
        }
        .indicator-inner {
            position: absolute;
            bottom: 8px;
            z-index: 10;
            color: #00ffff;
            font-size: 26px;
            text-shadow: 0 0 10px #00ffff;
            font-weight: bold;
        }

        /* Wou Deyò (Lajè: 340px) */
        .wheel-outer {
            position: absolute;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            border: 6px solid #ffd700;
            background: #111;
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
            box-shadow: 0 0 25px rgba(241, 196, 15, 0.4);
        }

        /* Wou Mitan / Andedan - KOUNYE A LI LAJ ANPIL (Lajè: 240px olye de 170px) */
        .wheel-inner {
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 5px solid #00ffff;
            background: #1a1a1a;
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
            z-index: 2;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }

        .wheel-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        /* Stil pou CHIF YO - Tou de gen menm gwo modèl la koulye a */
        .number {
            position: absolute;
            width: 35px;
            height: 35px;
            font-weight: 900; /* Byen gra */
            font-size: 18px;  /* Byen gwo pou tou de */
            display: flex;
            justify-content: center;
            align-items: center;
            left: 50%;
            top: 50%;
        }

        /* Koulè Wou Deyò */
        .num-red { color: #ff3333; text-shadow: 0 0 5px #ff0000; }
        .num-black { color: #ffffff; text-shadow: 0 0 5px #000; }
        
        /* Koulè Wou Mitan (Laj) */
        .num-inner-style { color: #00ffff; text-shadow: 0 0 5px #00ffff; }
        .num-zero { color: #ff0055; text-shadow: 0 0 8px #ff0055; font-size: 20px !important; }

        .controls { margin-top: 15px; }
        input[type="number"] {
            background: #000;
            border: 2px solid #00ff00;
            color: #00ff00;
            padding: 8px;
            width: 70px;
            font-size: 18px;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
        }

        button {
            background: linear-gradient(135deg, #00ff00, #00aa00);
            border: none;
            color: black;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
            text-transform: uppercase;
            margin-top: 10px;
        }
        button:disabled { background: #444; color: #888; box-shadow: none; cursor: not-allowed; }

        .result-box {
            margin-top: 15px;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px;
            border-radius: 10px;
            display: inline-block;
            min-width: 300px;
            border: 1px solid rgba(0, 255, 0, 0.3);
        }
        .highlight { font-weight: bold; color: #00ff00; font-size: 22px; }
        .highlight-mult { font-weight: bold; color: #00ffff; font-size: 22px; }
    </style>
</head>
<body>

    <h2>EROBLACK ROULETTE PRO 32</h2>

    <div class="roulette-container">
        <!-- Egiy endikatè yo fiks anndan zòn nan -->
        <div class="indicator-outer">▼</div>
        <div class="indicator-inner">▲</div>
        
        <!-- Wou Deyò -->
        <div class="wheel-outer" id="outerWheel">
            <div class="wheel-text" id="outerTexts"></div>
        </div>
        
        <!-- Wou Mitan Laj -->
        <div class="wheel-inner" id="innerWheel">
            <div class="wheel-text" id="innerTexts"></div>
        </div>
    </div>

    <div class="controls">
        <label for="chwa" style="font-size: 16px;">Mize sou yon chif (1-32): </label>
        <input type="number" id="chwa" min="1" max="32" value="7">
        <br>
        <button id="spinBtn" onclick="vireRoulettePro()">VIRE ROULETTE LA</button>
    </div>

    <div class="result-box">
        <div id="status">Chwazi nimewo w la epi klike sou bouton an! 🎲</div>
    </div>

    <script>
        const totalNimewo = 32;
        const degrePaSeksyon = 360 / totalNimewo;

        const outerTexts = document.getElementById('outerTexts');
        const innerTexts = document.getElementById('innerTexts');

        // REYON YO AJISTE: 
        // Reyon deyò a rete 145px pou chif yo bò rebò a
        // Reyon andedan an vin 98px pou chif yo ka gaye byen gwo nan wou mitan ki laj la
        const reyonDeyo = 145;  
        const reyonAndedan = 98; 

        // Jenere Wou Deyò (1-32)
        for(let i = 0; i < totalNimewo; i++) {
            let angleRad = (i * degrePaSeksyon - 90) * (Math.PI / 180); 
            
            let divOuter = document.createElement('div');
            divOuter.className = `number ${i % 2 === 0 ? 'num-red' : 'num-black'}`;
            divOuter.innerText = i + 1;
            
            let x = reyonDeyo * Math.cos(angleRad);
            let y = reyonDeyo * Math.sin(angleRad);
            
            let rotChif = i * degrePaSeksyon;
            divOuter.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${rotChif}deg)`;
            outerTexts.appendChild(divOuter);
        }

        // Jenere Wou Mitan Laj (X0-X31)
        for(let i = 0; i < totalNimewo; i++) {
            let angleRad = (i * degrePaSeksyon - 90) * (Math.PI / 180);
            
            let divInner = document.createElement('div');
            divInner.className = 'number';
            
            if (i === 0) {
                divInner.classList.add('num-zero');
            } else {
                divInner.classList.add('num-inner-style');
            }
            divInner.innerText = "X" + i;
            
            let x = reyonAndedan * Math.cos(angleRad);
            let y = reyonAndedan * Math.sin(angleRad);
            
            let rotChif = i * degrePaSeksyon;
            divInner.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${rotChif}deg)`;
            innerTexts.appendChild(divInner);
        }

        let kouranDegreOuter = 0;
        let kouranDegreInner = 0;

        function sendToApp(bwat, val) {
            if (window.Android) { window.Android.voyeKòb(bwat, val.toString()); }
            if (window.SketchwareInterface) { window.SketchwareInterface.voyeKòb(bwat + ":" + val); }
        }

        function vireRoulettePro() {
            const chwaItilizate = parseInt(document.getElementById('chwa').value);
            
            if(chwaItilizate < 1 || chwaItilizate > 32 || isNaN(chwaItilizate)) {
                alert("Tanpri chwazi yon chif ant 1 ak 32!");
                return;
            }

            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            document.getElementById('status').innerHTML = "Wou yo ap vire ak gwo vitès... 🎰";

            const endèksDeyoGayan = Math.floor(Math.random() * totalNimewo); 
            const endèksAndedanGayan = Math.floor(Math.random() * totalNimewo); 

            const chifGayan = endèksDeyoGayan + 1; 
            const miltiplikatèGayan = endèksAndedanGayan; 

            const fwaVire = 5 * 360; 
            
            // Kalkil wotasyon pafè pa rapò ak nouvo reyon yo
            kouranDegreOuter += fwaVire + (360 - (endèksDeyoGayan * degrePaSeksyon));
            kouranDegreInner -= (fwaVire + (180 + (endèksAndedanGayan * degrePaSeksyon)));

            document.getElementById('outerWheel').style.transform = `rotate(${kouranDegreOuter}deg)`;
            document.getElementById('innerWheel').style.transform = `rotate(${kouranDegreInner}deg)`;

            setTimeout(() => {
                btn.disabled = false;
                
                let teGenyen = (chwaItilizate === chifGayan);
                let mesaj = "";

                if (teGenyen) {
                    if (miltiplikatèGayan === 0) {
                        mesaj = `🎯 Ou jwenn nimewo <span class="highlight">${chifGayan}</span> lan! <br>Men, miltiplikatè a bay <span class="num-zero">X0</span>... Ou touche 0 fwa mize w lan! 😮`;
                        sendToApp("roulette_genyen", "0");
                    } else {
                        mesaj = `🎉 **BRAVO!** Wou a bay nimewo <span class="highlight">${chifGayan}</span>!<br>Miltiplikatè ou se: <span class="highlight-mult">X${miltiplikatèGayan}</span>!`;
                        sendToApp("roulette_genyen", miltiplikatèGayan);
                    }
                } else {
                    mesaj = `😞 **Ou pèdi!** Wou a bay nimewo <span class="highlight" style="color:#ff3333">${chifGayan}</span>.<br>Miltiplikatè a te soti: X${miltiplikatèGayan}.`;
                    sendToApp("roulette_pedi", "0");
                }

                document.getElementById('status').innerHTML = mesaj;
            }, 5000);
        }
    </script>
</body>
</html>
