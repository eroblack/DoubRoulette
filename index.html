<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pierre Lannier Luxury Edition</title>
    <style>
        :root {
            --burgundy: #800020;
            --anthracite: #3a3a3a;
            --silver: #d1d1d1;
            --sunray: radial-gradient(circle, #a52a2a 0%, #4b0014 100%);
        }

        body {
            background-color: #050505;
            color: var(--silver);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Boîtier Montre la (San Braslè) */
        .watch-body {
            position: relative;
            width: 380px;
            height: 380px;
            background: linear-gradient(145deg, #444, #111);
            border-radius: 50%;
            padding: 8px;
            border: 2px solid #222;
            box-shadow: 0 40px 80px rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Kadran Wouj la */
        .dial-plate {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--sunray);
            border-radius: 50%;
            border: 1px solid #333;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.6);
        }

        .wheel-container {
            position: absolute;
            width: 100%;
            height: 100%;
            transition: transform 7s cubic-bezier(0.1, 0, 0.1, 1);
        }

        /* Egwi Santral Blan */
        .hand-needle {
            position: absolute;
            top: 20px;
            z-index: 100;
            width: 2px;
            height: 60px;
            background: #fff;
            box-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .number-slot {
            position: absolute;
            left: 50%; top: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Chif Deyò yo (Blan Fen) */
        .num-white {
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            font-weight: 200;
            letter-spacing: 1px;
        }

        /* BOUTON RADIO STYLE "REPÈRE" */
        .radio-index {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            font-size: 8px;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.6s ease;
        }

        /* Lè miltiplikatè a genyen (Flash Blan) */
        .radio-index.active-win {
            background: #fff;
            color: #800020;
            box-shadow: 0 0 20px #fff;
            border-color: #fff;
            transform: scale(1.2);
        }

        .center-logo {
            position: absolute;
            z-index: 10;
            color: white;
            font-size: 24px;
            font-weight: 100;
            opacity: 0.8;
            pointer-events: none;
        }

        button {
            margin-top: 50px;
            background: transparent;
            color: white;
            border: 1px solid #444;
            padding: 12px 50px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: 0.4s;
        }

        button:hover {
            border-color: #fff;
            background: rgba(255,255,255,0.05);
        }

        #log {
            margin-top: 20px;
            font-size: 10px;
            letter-spacing: 3px;
            color: #666;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="watch-body">
        <div class="hand-needle"></div>
        <div class="center-logo">P</div>
        
        <div class="dial-plate">
            <div class="wheel-container" id="wheelO"></div>
            <div class="wheel-container" id="wheelI" style="width: 200px; height: 200px; left: 90px; top: 90px;"></div>
        </div>
    </div>

    <button onclick="spinLuxe()">Start Chrono</button>
    <div id="log">Chronomètre Prêt</div>

    <script>
        const total = 32;
        const deg = 360 / total;

        // Chif Deyò sou kadran an
        for(let i = 0; i < total; i++) {
            let el = document.createElement('div');
            el.className = 'number-slot num-white';
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 155 * Math.cos(angleRad);
            let y = 155 * Math.sin(angleRad);
            el.innerText = i + 1;
            el.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            document.getElementById('wheelO').appendChild(el);
        }

        // Miltiplikatè Style Repère (Radio)
        for(let i = 0; i < total; i++) {
            let container = document.createElement('div');
            container.className = 'number-slot';
            let radio = document.createElement('div');
            radio.className = 'radio-index';
            radio.id = 'idx-' + i;
            radio.innerText = i;
            
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 75 * Math.cos(angleRad);
            let y = 75 * Math.sin(angleRad);
            
            container.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            container.appendChild(radio);
            document.getElementById('wheelI').appendChild(container);
        }

        let rotO = 0; let rotI = 0;

        function spinLuxe() {
            document.querySelectorAll('.radio-index').forEach(r => r.classList.remove('active-win'));
            
            const resO = Math.floor(Math.random() * total);
            const resI = Math.floor(Math.random() * total);

            document.getElementById('log').innerText = "Mouvement Automatique...";

            rotO += 2520 + (360 - (resO * deg));
            document.getElementById('wheelO').style.transform = `rotate(${rotO}deg)`;

            setTimeout(() => {
                rotI -= (2520 + (180 + (resI * deg)));
                document.getElementById('wheelI').style.transform = `rotate(${rotI}deg)`;
                
                setTimeout(() => {
                    document.getElementById('idx-' + resI).classList.add('active-win');
                    document.getElementById('log').innerHTML = `Index: ${resO + 1} | Calibre: x${resI}`;
                }, 7000);
            }, 600);
        }
    </script>
</body>
</html>
