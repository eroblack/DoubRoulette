<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Casino Normal</title>
    <style>
        body {
            background: radial-gradient(circle, #1a472a, #000);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }

        .roulette-container {
            position: relative;
            width: 380px;
            height: 380px;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Egwi Deyò Anlè */
        .indicator-outer {
            position: absolute;
            top: 0px;
            z-index: 100;
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ff0000;
        }

        /* Egwi Andedan Anba */
        .indicator-inner {
            position: absolute;
            bottom: 95px;
            z-index: 100;
            width: 0; height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 25px solid #00ffff;
        }

        /* Wou Deyò */
        .wheel-outer {
            position: absolute;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: #111;
            border: 5px solid #ffd700;
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        /* Wou Mitan */
        .wheel-inner {
            position: absolute;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            background: #004d00;
            border: 4px solid #ffd700;
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
            z-index: 2;
        }

        .number {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            left: 50%;
            top: 50%;
            font-weight: bold;
        }

        /* Chif Wou Deyò - Byen Normal */
        .outer-slot {
            width: 40px;
            height: 40px;
            font-size: 22px; /* Gwo Chif */
            color: #fff;
        }

        /* Chif Wou Miltiplikatè - Byen Normal */
        .inner-slot {
            width: 30px;
            height: 30px;
            font-size: 16px;
            color: #ffd700;
        }

        .controls { margin-top: 20px; }
        button { 
            background: #ffd700; color: #000; padding: 15px 30px; 
            border-radius: 30px; font-weight: bold; border: none; cursor: pointer; 
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h2 style="color:#ffd700">EROBLACK ROULETTE</h2>

    <div class="roulette-container">
        <div class="indicator-outer"></div>
        <div class="indicator-inner"></div>
        
        <div class="wheel-outer" id="outerWheel"></div>
        <div class="wheel-inner" id="innerWheel"></div>
    </div>

    <div class="controls">
        <input type="number" id="chwa" value="7" style="padding:10px; width:60px; font-size:18px;">
        <button id="spinBtn" onclick="vireRoulette()">VIRE</button>
    </div>

    <div id="status" style="margin-top:15px; font-size:20px;"></div>

    <script>
        const total = 32;
        const deg = 360 / total;

        // Kreye Chif Wou Deyò
        for(let i = 0; i < total; i++) {
            let n = document.createElement('div');
            n.className = 'number outer-slot';
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 145 * Math.cos(angleRad);
            let y = 145 * Math.sin(angleRad);
            // Chif la rete dwat (0 degre)
            n.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(0deg)`;
            n.innerText = i + 1;
            document.getElementById('outerWheel').appendChild(n);
        }

        // Kreye Chif Wou Mitan
        for(let i = 0; i < total; i++) {
            let n = document.createElement('div');
            n.className = 'number inner-slot';
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 90 * Math.cos(angleRad);
            let y = 90 * Math.sin(angleRad);
            // Chif la rete dwat (0 degre)
            n.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(0deg)`;
            n.innerText = i;
            document.getElementById('innerWheel').appendChild(n);
        }

        let rO = 0; let rI = 0;

        function vireRoulette() {
            const resO = Math.floor(Math.random() * total);
            const resI = Math.floor(Math.random() * total);

            rO += 1440 + (360 - (resO * deg));
            document.getElementById('outerWheel').style.transform = `rotate(${rO}deg)`;

            document.getElementById('status').innerText = "Wou 1 ap vire...";

            setTimeout(() => {
                document.getElementById('status').innerText = "Nimewo: " + (resO + 1) + ". Kounye a miltiplikatè...";
                rI -= (1440 + (180 + (resI * deg)));
