<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Roulette Pro</title>
    <style>
        :root {
            --bg: #050505;
            --gold: #d4af37;
            --silver: #ffffff;
        }

        body {
            background-color: var(--bg);
            color: var(--silver);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Panèl kontwòl senp */
        .control-panel {
            margin-bottom: 30px;
            text-align: center;
        }

        .input-bet {
            background: #111;
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 15px;
            font-size: 20px;
            font-weight: 900;
            width: 120px;
            text-align: center;
            border-radius: 12px;
            outline: none;
        }

        /* Wou a */
        .watch-body {
            position: relative;
            width: 380px; height: 380px;
            background: #111;
            border-radius: 50%;
            border: 8px solid #1a1a1a;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
        }

        .dial-plate {
            position: relative;
            width: 100%; height: 100%;
            background: radial-gradient(circle, #4a000e 0%, #000 100%);
            border-radius: 50%; overflow: hidden;
        }

        /* Egwi a */
        .needle {
            position: absolute; top: -10px; left: 50%;
            transform: translateX(-50%);
            width: 6px; height: 40px;
            background: #fff; z-index: 100;
            box-shadow: 0 0 10px #fff;
            border-radius: 0 0 4px 4px;
        }

        .center-display {
            position: absolute; z-index: 110;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80px; height: 80px;
            background: #000; border: 3px solid var(--gold);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: 900; color: #fff;
        }

        .wheel-container {
            position: absolute; width: 100%; height: 100%;
            transition: transform 7s cubic-bezier(0.1, 0, 0, 1);
        }

        .number-slot {
            position: absolute; left: 50%; top: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 18px; font-weight: 800; color: #fff;
        }

        .btn-play {
            margin-top: 40px; background: var(--gold); color: #000;
            border: none; padding: 18px 60px; border-radius: 50px;
            text-transform: uppercase; letter-spacing: 3px; font-weight: 900;
            cursor: pointer; transition: 0.3s;
        }

        .btn-play:disabled { background: #333; color: #666; }

        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center;
        }

        .modal-content {
            background: #111; padding: 30px; border-radius: 20px;
            border: 2px solid var(--gold); text-align: center; width: 260px;
        }

        .modal-btn {
            background: var(--gold); border: none; padding: 12px; width: 100%;
            border-radius: 8px; font-weight: 900; cursor: pointer; margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <p style="margin-bottom: 10px; font-weight: 800;">TAPE NIMEWO OU (0-36):</p>
        <input type="number" id="userBet" class="input-bet" min="0" max="36" placeholder="00">
    </div>

    <div class="watch-body">
        <div class="needle"></div>
        <div class="center-display" id="centerRes">--</div>
        <div class="dial-plate">
            <div id="wheel" class="wheel-container"></div>
        </div>
    </div>

    <button class="btn-play" id="spinBtn" onclick="confirmPlay()">VIRE (5 HTG)</button>

    <div id="resModal" class="modal">
        <div class="modal-content">
            <h2 id="resTitle" style="margin-top:0"></h2>
            <p id="resMsg" style="font-size: 18px;"></p>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        const ordinaryOrder = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7];
        const total = ordinaryOrder.length;
        const degStep = 360 / total;

        // Inisyalize Wou a
        const wheel = document.getElementById('wheel');
        for(let i = 0; i < total; i++) {
            let angle = i * degStep;
            let rad = (angle - 90) * (Math.PI / 180);
            let el = document.createElement('div');
            el.className = 'number-slot';
            el.innerText = ordinaryOrder[i];
            el.style.transform = `translate(calc(-50% + ${160 * Math.cos(rad)}px), calc(-50% + ${160 * Math.sin(rad)}px)) rotate(${angle}deg)`;
            wheel.appendChild(el);
        }

        let currentRotation = 0;

        function confirmPlay() {
            const val = document.getElementById('userBet').value;
            if(val === "" || val < 0 || val > 36) {
                alert("Tanpri antre yon nimewo ant 0 ak 36");
                return;
            }
            startSpin();
        }

        function startSpin() {
            const btn = document.getElementById('spinBtn');
            const center = document.getElementById('centerRes');
            btn.disabled = true;
            center.innerText = "••";

            const winIdx = Math.floor(Math.random() * total);
            // Kalkil wotasyon pafè pou rezilta a tonbe anba egwi a
            // 3600 (10 tò) + rès degre pou chif la santre
            const targetRotation = 3600 + (360 - (winIdx * degStep));
            currentRotation += targetRotation;

            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                const winNum = ordinaryOrder[winIdx];
                const userChoice = parseInt(document.getElementById('userBet').value);
                
                center.innerText = winNum;
                btn.disabled = false;

                if(winNum === userChoice) {
                    showResult("OU GENYEN!", `Nimewo a se <b>${winNum}</b>.<br>Ou genyen 50 HTG!`);
                } else {
                    showResult("DOMAJ", `Nimewo a se te <b>${winNum}</b>.<br>Eseye ankò!`);
                }
            }, 7200);
        }

        function showResult(title, msg) {
            document.getElementById('resTitle').innerHTML = title;
            document.getElementById('resMsg').innerHTML = msg;
            document.getElementById('resModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('resModal').style.display = 'none';
        }
    </script>
</body>
</html>
