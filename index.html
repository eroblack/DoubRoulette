<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Watch Roulette</title>
    <style>
        :root {
            --gold: #d4af37;
            --rose-gold: linear-gradient(135deg, #e5b299 0%, #b38b71 100%);
            --dial-bg: radial-gradient(circle, #2c2c2c 0%, #000 100%);
            --acier: linear-gradient(to bottom, #bdc3c7, #2c3e50);
        }

        body {
            background-color: #0f0f0f;
            color: #d1d1d1;
            font-family: 'Times New Roman', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Boîtier Montre la */
        .watch-case {
            position: relative;
            width: 380px;
            height: 380px;
            background: var(--rose-gold);
            border-radius: 50%;
            padding: 15px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Kadran anndan an */
        .dial {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--dial-bg);
            border-radius: 50%;
            border: 2px solid #555;
            overflow: hidden;
        }

        .wheel-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            transition: transform 6s cubic-bezier(0.15, 0, 0.15, 1);
        }

        /* Wou santral la (Miltiplikatè) */
        .wheel-inner {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid var(--gold);
            border-radius: 50%;
            z-index: 5;
            transition: transform 6s cubic-bezier(0.15, 0, 0.15, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        /* Egwi Montre la */
        .hand {
            position: absolute;
            top: 10px;
            z-index: 100;
            width: 2px;
            height: 40px;
            background: var(--gold);
            box-shadow: 0 0 10px var(--gold);
        }

        .number {
            position: absolute;
            left: 50%; top: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Chif Montre Luxe */
        .num-lux {
            color: #d4af37;
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* Radio Buttons (Miltiplikatè Style Repère) */
        .radio-point {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1px solid rgba(212, 175, 55, 0.3);
            background: transparent;
            font-size: 8px;
            color: #888;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.5s;
        }

        .radio-point.winner {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 15px var(--gold);
            border-color: #fff;
        }

        .controls {
            position: absolute;
            bottom: -80px;
            width: 100%;
            text-align: center;
        }

        button {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 10px 40px;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: var(--gold);
            color: black;
        }

        #status {
            margin-top: 15px;
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--gold);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="watch-case">
        <div class="hand"></div>
        <div class="dial">
            <div class="wheel-outer" id="wheelO"></div>
            <div class="wheel-inner" id="wheelI"></div>
        </div>

        <div class="controls">
            <input type="number" id="chwa" value="12" style="background:none; border:1px solid #333; color:gold; padding:5px; width:40px; text-align:center;">
            <br><br>
            <button onclick="vireLuxe()">Lancer</button>
            <div id="status">Chronographe Prêt</div>
        </div>
    </div>

    <script>
        const total = 32;
        const deg = 360 / total;

        // Chif Deyò (Style Montre)
        for(let i = 0; i < total; i++) {
            let n = document.createElement('div');
            n.className = 'number num-lux';
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 150 * Math.cos(angleRad);
            let y = 150 * Math.sin(angleRad);
            n.innerText = i + 1;
            n.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            document.getElementById('wheelO').appendChild(n);
        }

        // Chif Miltiplikatè (Radio Button Luxe)
        for(let i = 0; i < total; i++) {
            let container = document.createElement('div');
            container.className = 'number';
            let radio = document.createElement('div');
            radio.className = 'radio-point';
            radio.id = 'milt-' + i;
            radio.innerText = i;
            
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 75 * Math.cos(angleRad);
            let y = 75 * Math.sin(angleRad);
            
            container.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            container.appendChild(radio);
            document.getElementById('wheelI').appendChild(container);
        }

        let rO = 0; let rI = 0;

        function vireLuxe() {
            document.querySelectorAll('.radio-point').forEach(p => p.classList.remove('winner'));
            const resO = Math.floor(Math.random() * total);
            const resI = Math.floor(Math.random() * total);

            document.getElementById('status').innerText = "Mouvement en cours...";

            rO += 2160 + (360 - (resO * deg));
            document.getElementById('wheelO').style.transform = `rotate(${rO}deg)`;

            setTimeout(() => {
                rI -= (2160 + (180 + (resI * deg)));
                document.getElementById('wheelI').style.transform = `rotate(${rI}deg)`;
                
                setTimeout(() => {
                    document.getElementById('milt-' + resI).classList.add('winner');
                    document.getElementById('status').innerHTML = `Position: ${resO + 1} | Calibre: x${resI}`;
                }, 6000);
            }, 500);
        }
    </script>
</body>
</html>
