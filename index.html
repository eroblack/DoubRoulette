<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Deluxe - Strategic</title>
    <style>
        :root {
            --sunray: radial-gradient(circle, #8a1a2d 0%, #2b0008 100%);
            --gold: #d4af37;
            --silver: #e0e0e0;
        }

        body {
            background-color: #050505;
            color: var(--silver);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .status-bar {
            margin-bottom: 20px;
            text-align: center;
        }

        .bet-selector {
            background: #1a1a1a;
            color: var(--gold);
            border: 2px solid var(--gold);
            padding: 12px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            outline: none;
        }

        .watch-body {
            position: relative;
            width: 380px;
            height: 380px;
            background: linear-gradient(145deg, #2a2a2a, #000);
            border-radius: 50%;
            padding: 10px;
            border: 4px solid #1a1a1a;
            box-shadow: 0 40px 80px rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dial-plate {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--sunray);
            border-radius: 50%;
            overflow: hidden;
        }

        .needle-main {
            position: absolute;
            top: 5px; left: 50%;
            transform: translateX(-50%);
            width: 4px; height: 20px;
            background: #fff;
            z-index: 100;
            box-shadow: 0 0 10px #fff;
            border-radius: 2px;
        }

        .result-fixed-slot {
            position: absolute;
            z-index: 110;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 75px; height: 75px;
            background: rgba(0,0,0,0.85);
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .res-val { font-size: 24px; font-weight: 900; color: #fff; }
        .res-label { font-size: 9px; color: var(--gold); font-weight: 700; text-transform: uppercase; }

        .wheel-container {
            position: absolute;
            width: 380px; height: 380px;
            transition: transform 7s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .number-slot {
            position: absolute;
            left: 50%; top: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .num-white { font-size: 15px; font-weight: 900; color: #fff; }

        .text-index {
            font-size: 16px;
            font-weight: 950;
            color: rgba(255, 255, 255, 0.2);
            transition: all 0.4s ease;
        }

        .text-index.winner {
            color: var(--gold);
            transform: scale(1.5);
            text-shadow: 0 0 20px var(--gold);
        }

        .btn-play {
            margin-top: 40px;
            background: var(--gold);
            color: #000;
            border: none;
            padding: 15px 70px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
        }

        .btn-play:disabled { background: #444; color: #888; cursor: not-allowed; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #111;
            padding: 30px;
            border-radius: 20px;
            border: 2px solid var(--gold);
            text-align: center;
            width: 280px;
        }

        .modal-btn {
            background: var(--gold);
            border: none;
            padding: 12px 30px;
            margin-top: 15px;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
            width: 100%;
        }

        .modal-btn.cancel { background: #333; color: #fff; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="status-bar">
        <select id="betNumber" class="bet-selector"></select>
    </div>

    <div class="watch-body">
        <div class="needle-main"></div>
        <div class="result-fixed-slot">
            <span class="res-label">Nimewo</span>
            <span id="digitalDisplay" class="res-val">--</span>
        </div>
        <div class="dial-plate">
            <div id="wheelO" class="wheel-container"></div>
            <div id="wheelI" class="wheel-container" style="width: 240px; height: 240px; left: 70px; top: 70px;"></div>
        </div>
    </div>

    <button class="btn-play" id="spinBtn" onclick="showPaymentDialog()">Vire (5 HTG)</button>

    <div id="payModal" class="modal">
        <div class="modal-content">
            <h3 style="color:var(--gold)">KONFIME</h3>
            <p>Peye 5 HTG pou vire?</p>
            <button class="modal-btn" onclick="confirmPayment()">WI, PEYE</button>
            <button class="modal-btn cancel" onclick="closeModal('payModal')">ANILE</button>
        </div>
    </div>

    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h2 id="resTitle" style="margin-top:0"></h2>
            <p id="resMsg" style="font-size: 18px;"></p>
            <button class="modal-btn" onclick="closeModal('resultModal')">OK</button>
        </div>
    </div>

    <script>
        const betCost = 5;
        const ordinaryOrder = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7];
        const strategicMiddle = [1, 5, 2, 10, 3, 1, 2, 5, 1, 20, 2, 1, 5, 1, 10, 2, 5, 1, 2, 50, 1, 5, 2, 10, 1, 5, 2, 1, 10, 2, 5, 1]; // Miltiplikatè
        
        const total = ordinaryOrder.length;
        const deg = 360 / total;

        function format(n) { return n < 10 ? '0' + n : n; }

        const select = document.getElementById('betNumber');
        for(let i=0; i<37; i++) {
            let opt = document.createElement('option');
            opt.value = i; opt.innerText = "PARI SOU: " + format(i);
            select.appendChild(opt);
        }

        // Jenere Wou yo
        for(let i = 0; i < total; i++) {
            let el = document.createElement('div');
            el.className = 'number-slot num-white';
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 165 * Math.cos(angleRad);
            let y = 165 * Math.sin(angleRad);
            el.id = 'num-' + i;
            el.innerText = format(ordinaryOrder[i]);
            el.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${i * deg}deg)`;
            document.getElementById('wheelO').appendChild(el);

            let container = document.createElement('div');
            container.className = 'number-slot';
            let txt = document.createElement('div');
            txt.className = 'text-index';
            txt.id = 'mult-' + i;
            txt.innerText = 'x' + strategicMiddle[i];
            let xI = 90 * Math.cos(angleRad);
            let yI = 90 * Math.sin(angleRad);
            container.style.transform = `translate(calc(-50% + ${xI}px), calc(-50% + ${yI}px)) rotate(${i * deg}deg)`;
            container.appendChild(txt);
            document.getElementById('wheelI').appendChild(container);
        }

        function showPaymentDialog() {
            document.getElementById('payModal').style.display = 'flex';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function confirmPayment() {
            closeModal('payModal');
            startSpin();
        }

        let rotO = 0; let rotI = 0;
        function startSpin() {
            document.getElementById('spinBtn').disabled = true;
            document.querySelectorAll('.text-index, .num-white').forEach(t => t.style.color = '');
            document.getElementById('digitalDisplay').innerText = "••";

            const winIdxO = Math.floor(Math.random() * total);
            const winIdxI = Math.floor(Math.random() * total);

            rotO += 2880 + (360 - (winIdxO * deg));
            rotI -= (2880 + (180 + (winIdxI * deg)));

            document.getElementById('wheelO').style.transform = `rotate(${rotO}deg)`;
            document.getElementById('wheelI').style.transform = `rotate(${rotI}deg)`;

            setTimeout(() => {
                const winNum = ordinaryOrder[winIdxO];
                const winMult = strategicMiddle[winIdxI];
                const userChoice = parseInt(document.getElementById('betNumber').value);
                
                document.getElementById('digitalDisplay').innerText = format(winNum);
                document.getElementById('spinBtn').disabled = false;

                if(winNum === userChoice) {
                    let totalWin = betCost * winMult;
                    showResult("BRAVO!", `Ou jwenn ${format(winNum)}!<br>Miltiplikatè: x${winMult}<br><b style="color:var(--gold)">Ou genyen ${totalWin} HTG!</b>`);
                } else {
                    showResult("DOMAJ", `Chif la se te ${format(winNum)}.<br>Miltiplikatè a te x${winMult}.<br>Eseye ankò!`);
                }
            }, 7500);
        }

        function showResult(title, msg) {
            document.getElementById('resTitle').innerHTML = title;
            document.getElementById('resMsg').innerHTML = msg;
            document.getElementById('resultModal').style.display = 'flex';
        }
    </script>
</body>
</html>
