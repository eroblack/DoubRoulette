<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XP Black Roulette Edition</title>
    <style>
        body {
            background: #000; /* Fond nwa total */
            color: white;
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Fenèt Windows XP Style */
        .xp-window {
            background: #222;
            border: 3px solid #0055ee; /* Ble XP klasik la */
            border-radius: 8px 8px 0 0;
            width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* Tit Fenèt la */
        .xp-title-bar {
            background: linear-gradient(to bottom, #0058e7 0%, #0036a6 100%);
            padding: 5px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 13px;
            color: white;
            text-shadow: 1px 1px #000;
        }

        .xp-buttons {
            display: flex;
            gap: 3px;
        }

        .xp-btn {
            width: 21px;
            height: 21px;
            background: #ccc;
            border: 1px solid #fff;
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: black;
            font-size: 10px;
            font-weight: bold;
        }

        .xp-close { background: #e04343; color: white; }

        .roulette-container {
            position: relative;
            width: 360px;
            height: 360px;
            margin: 20px auto;
            background: radial-gradient(circle, #333, #000);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #444;
        }

        /* Wou Deyò (Black Glossy) */
        .wheel-outer {
            position: absolute;
            width: 330px;
            height: 330px;
            border-radius: 50%;
            background: #111;
            border: 6px solid #0055ee;
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
            box-shadow: inset 0 0 20px rgba(0,85,238,0.3);
        }

        /* Wou Mitan (Silver XP) */
        .wheel-inner {
            position: absolute;
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background: linear-gradient(135deg, #444, #111);
            border: 4px solid #0055ee;
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
            z-index: 2;
        }

        .number {
            position: absolute;
            left: 50%; top: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .outer-num { color: #00ff00; font-size: 16px; text-shadow: 0 0 5px #00ff00; }
        .inner-num { color: #00ffff; font-size: 10px; }

        .indicator {
            position: absolute;
            top: -10px;
            z-index: 20;
            color: #00ff00;
            font-size: 30px;
            filter: drop-shadow(0 0 5px #00ff00);
        }

        /* Bouton XP Style */
        .controls {
            padding: 20px;
            background: #dcd9d3; /* Koulè gri klasik la */
            border-top: 1px solid #808080;
        }

        button {
            background: linear-gradient(to bottom, #76d05e 0%, #3e9f2a 100%);
            border: 1px solid #2e7d1d;
            border-radius: 5px;
            color: white;
            padding: 10px 30px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-shadow: 1px 1px #000;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        button:active {
            background: linear-gradient(to top, #76d05e 0%, #3e9f2a 100%);
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.5);
        }

        #status {
            background: #000;
            color: #00ff00;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            border: 1px solid #0055ee;
            margin-top: 10px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="xp-window">
        <div class="xp-title-bar">
            <span>Roulette_Professional_XP.exe</span>
            <div class="xp-buttons">
                <div class="xp-btn">_</div>
                <div class="xp-btn">□</div>
                <div class="xp-btn xp-close">X</div>
            </div>
        </div>

        <div class="roulette-container">
            <div class="indicator">▼</div>
            <div class="wheel-outer" id="wheelO"></div>
            <div class="wheel-inner" id="wheelI"></div>
        </div>

        <div class="controls">
            <input type="number" id="chwa" value="7" style="padding:5px; width:50px;">
            <button onclick="vireXP()">START SPIN</button>
            <div id="status">C:\WINDOWS\system32> Await input...</div>
        </div>
    </div>

    <script>
        const total = 32;
        const deg = 360 / total;

        for(let i = 0; i < total; i++) {
            let n = document.createElement('div');
            n.className = 'number outer-num';
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 140 * Math.cos(angleRad);
            let y = 140 * Math.sin(angleRad);
            n.innerText = i + 1;
            n.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(0deg)`;
            document.getElementById('wheelO').appendChild(n);
        }

        for(let i = 0; i < total; i++) {
            let n = document.createElement('div');
            n.className = 'number inner-num';
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 75 * Math.cos(angleRad);
            let y = 75 * Math.sin(angleRad);
            n.innerText = i;
            n.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(0deg)`;
            document.getElementById('wheelI').appendChild(n);
        }

        let curO = 0; let curI = 0;

        function vireXP() {
            const resO = Math.floor(Math.random() * total);
            const resI = Math.floor(Math.random() * total);
            document.getElementById('status').innerText = "C:\\WINDOWS\\system32> Executing spin...";

            curO += 1440 + (360 - (resO * deg));
            document.getElementById('wheelO').style.transform = `rotate(${curO}deg)`;

            setTimeout(() => {
                curI -= (1440 + (180 + (resI * deg)));
                document.getElementById('wheelI').style.transform = `rotate(${curI}deg)`;
                
                setTimeout(() => {
                    document.getElementById('status').innerHTML = `C:\\> Result: ${resO + 1} | Mult: X${resI} [Success]`;
                }, 5000);
            }, 800);
        }
    </script>
</body>
</html>
