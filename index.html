<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pierre Lannier - Eroblack Pay</title>
    <style>
        :root {
            --burgundy: #6b001a;
            --sunray: radial-gradient(circle, #8a1a2d 0%, #2b0008 100%);
            --silver: #e0e0e0;
        }

        body {
            background-color: #050505;
            color: var(--silver);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Panèl Balans */
        .balance-card {
            background: rgba(255,255,255,0.05);
            padding: 10px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: 700;
        }

        .watch-body {
            position: relative;
            width: 400px;
            height: 400px;
            background: linear-gradient(145deg, #2a2a2a, #000);
            border-radius: 50%;
            padding: 12px;
            border: 4px solid #1a1a1a;
            box-shadow: 0 50px 100px rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dial-plate {
            position: relative;
            width: 400px;
            height: 400px;
            background: var(--sunray);
            border-radius: 50%;
            overflow: hidden;
        }

        /* Sèl Egwi anlè a */
        .needle-main {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 20px;
            background: #fff;
            z-index: 100;
            box-shadow: 0 0 10px #fff;
            border-radius: 2px;
        }

        .result-fixed-slot {
            position: absolute;
            z-index: 110;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: rgba(0,0,0,0.7);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            backdrop-filter: blur(10px);
        }

        .wheel-container {
            position: absolute;
            width: 400px;
            height: 400px;
            transition: transform 7s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .number-slot {
            position: absolute;
            left: 50%; top: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .num-white {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 500;
        }

        /* CHIFFRE MITAN PWÈS GRA */
        .text-index {
            font-size: 16px;
            font-weight: 900; /* Pwès anpil */
            color: rgba(255, 255, 255, 0.25);
            transition: all 0.4s ease;
            letter-spacing: 1px;
        }

        .text-index.winner {
            color: #fff;
            transform: scale(1.5);
            text-shadow: 0 0 20px #fff;
        }

        .btn-play {
            margin-top: 40px;
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 70px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-play:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }

        #msg {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="balance-card">Balans: <span id="balance">100</span> HTG</div>

    <div class="watch-body">
        <div class="needle-main"></div>
        <div class="result-fixed-slot" id="digitalDisplay">P</div>
        
        <div class="dial-plate">
            <div class="wheel-container" id="wheelO"></div>
            <div class="wheel-container" id="wheelI" style="width: 240px; height: 240px; left: 80px; top: 80px;"></div>
        </div>
    </div>

    <button class="btn-play" id="spinBtn" onclick="payAndSpin()">Vire (5G)</button>
    <div id="msg">Miz: 5 HTG pou chak vire</div>

    <script>
        // Lojik Balans Eroblack
        let currentBalance = 100; 
        const betAmount = 5;

        const ordinaryOrder = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7];
        const total = ordinaryOrder.length;
        const deg = 360 / total;

        function formatNumber(num) {
            return num < 10 ? '0' + num : num;
        }

        // Jenere Chif Deyò
        for(let i = 0; i < total; i++) {
            let el = document.createElement('div');
            el.className = 'number-slot num-white';
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 175 * Math.cos(angleRad);
            let y = 175 * Math.sin(angleRad);
            el.innerText = formatNumber(ordinaryOrder[i]);
            el.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${i * deg}deg)`;
            document.getElementById('wheelO').appendChild(el);
        }

        // Jenere Chif Mitan (Pwès & Gra)
        for(let i = 0; i < total; i++) {
            let container = document.createElement('div');
            container.className = 'number-slot';
            let txt = document.createElement('div');
            txt.className = 'text-index';
            txt.id = 'val-' + i;
            txt.innerText = formatNumber(i);
            
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 95 * Math.cos(angleRad); 
            let y = 95 * Math.sin(angleRad);
            
            container.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            container.appendChild(txt);
            document.getElementById('wheelI').appendChild(container);
        }

        let rotO = 0; let rotI = 0;

        function payAndSpin() {
            if (currentBalance < betAmount) {
                alert("Ou pa gen ase kòb!");
                return;
            }

            // Pwotokòl Peman
            currentBalance -= betAmount;
            document.getElementById('balance').innerText = currentBalance;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('msg').innerText = "Tranzaksyon an kou...";

            spinLuxe();
        }

        function spinLuxe() {
            document.querySelectorAll('.text-index').forEach(t => t.classList.remove('winner'));
            document.getElementById('digitalDisplay').innerText = "••";
            
            const indexWinnerO = Math.floor(Math.random() * total);
            const resI = Math.floor(Math.random() * total);

            rotO += 2880 + (360 - (indexWinnerO * deg));
            document.getElementById('wheelO').style.transform = `rotate(${rotO}deg)`;

            setTimeout(() => {
                rotI -= (2880 + (180 + (resI * deg)));
                document.getElementById('wheelI').style.transform = `rotate(${rotI}deg)`;
                
                setTimeout(() => {
                    const winner = document.getElementById('val-' + resI);
                    winner.classList.add('winner');
                    document.getElementById('digitalDisplay').innerText = formatNumber(resI);
                    document.getElementById('spinBtn').disabled = false;
                    document.getElementById('msg').innerText = "Vire ankò pou 5 HTG";
                    
                    // Lojik genyen si ou vle ajoute l (Egzanp: si resI > 20, ou genyen 10 HTG)
                }, 7000);
            }, 400);
        }
    </script>
</body>
</html>
