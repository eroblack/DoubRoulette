<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pierre Lannier Swa Edition</title>
    <style>
        :root {
            --burgundy: #800020;
            --anthracite: #1a1a1a;
            --silver: #d1d1d1;
            --sunray: radial-gradient(circle, #a52a2a 0%, #3a000a 100%);
        }

        body {
            background-color: #050505;
            color: var(--silver);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .watch-body {
            position: relative;
            width: 380px;
            height: 380px;
            background: linear-gradient(145deg, #333, #000);
            border-radius: 50%;
            padding: 10px;
            border: 2px solid #222;
            box-shadow: 0 40px 80px rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dial-plate {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--sunray);
            border-radius: 50%;
            border: 1px solid #222;
            overflow: hidden;
        }

        /* Egwi Stab yo */
        .needle {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            z-index: 100;
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(255,255,255,0.4);
        }
        /* Gwo egwi kout pou wou deyò */
        .needle-outer { top: 15px; width: 3px; height: 40px; }
        /* Ti egwi pou wou mitan */
        .needle-inner { top: 110px; width: 2px; height: 20px; opacity: 0.8; }

        .wheel-container {
            position: absolute;
            width: 100%;
            height: 100%;
            transition: transform 7s cubic-bezier(0.1, 0, 0.1, 1);
        }

        .number-slot {
            position: absolute;
            left: 50%; top: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .num-white {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: 300;
        }

        /* CHIF MITAN DEBARASE & GRA */
        .text-index {
            font-size: 11px;
            font-weight: 900; /* Mete l an gra */
            color: rgba(255, 255, 255, 0.3);
            transition: all 0.5s ease;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .text-index.active-win {
            color: #fff;
            font-size: 16px;
            text-shadow: 0 0 15px #fff;
        }

        .center-logo {
            position: absolute;
            z-index: 10;
            color: white;
            font-size: 20px;
            font-weight: 100;
            opacity: 0.5;
        }

        button {
            margin-top: 50px;
            background: transparent;
            color: white;
            border: 1px solid #444;
            padding: 12px 50px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        #log {
            margin-top: 20px;
            font-size: 10px;
            letter-spacing: 3px;
            color: #555;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="watch-body">
        <div class="needle needle-outer"></div>
        <div class="needle needle-inner"></div>
        <div class="center-logo">P</div>
        
        <div class="dial-plate">
            <div class="wheel-container" id="wheelO"></div>
            <div class="wheel-container" id="wheelI" style="width: 160px; height: 160px; left: 110px; top: 110px;"></div>
        </div>
    </div>

    <button onclick="spinSwa()">Vire Chrono</button>
    <div id="log">Mouvement Prêt</div>

    <script>
        const total = 32;
        const deg = 360 / total;

        for(let i = 0; i < total; i++) {
            let el = document.createElement('div');
            el.className = 'number-slot num-white';
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 155 * Math.cos(angleRad);
            let y = 155 * Math.sin(angleRad);
            el.innerText = i + 1;
            el.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            document.getElementById('wheelO').appendChild(el);
        }

        for(let i = 0; i < total; i++) {
            let container = document.createElement('div');
            container.className = 'number-slot';
            let txt = document.createElement('div');
            txt.className = 'text-index';
            txt.id = 'txt-' + i;
            txt.innerText = i;
            
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 60 * Math.cos(angleRad); // Redwi distans pou l pi prop
            let y = 60 * Math.sin(angleRad);
            
            container.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            container.appendChild(txt);
            document.getElementById('wheelI').appendChild(container);
        }

        let rotO = 0; let rotI = 0;

        function spinSwa() {
            document.querySelectorAll('.text-index').forEach(t => t.classList.remove('active-win'));
            
            const resO = Math.floor(Math.random() * total);
            const resI = Math.floor(Math.random() * total);

            document.getElementById('log').innerText = "Rotation en cours...";

            rotO += 2520 + (360 - (resO * deg));
            document.getElementById('wheelO').style.transform = `rotate(${rotO}deg)`;

            setTimeout(() => {
                rotI -= (2520 + (180 + (resI * deg)));
                document.getElementById('wheelI').style.transform = `rotate(${rotI}deg)`;
                
                setTimeout(() => {
                    document.getElementById('txt-' + resI).classList.add('active-win');
                    document.getElementById('log').innerHTML = `Gagnant: ${resO + 1} | Mult: x${resI}`;
                }, 7000);
            }, 500);
        }
    </script>
</body>
</html>
