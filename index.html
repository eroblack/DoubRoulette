<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Mechanic Roulette</title>
    <style>
        body {
            background: #f4f1ea; /* Koulè papye vintage */
            color: #333;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 10px;
        }

        .main-wrapper {
            position: relative;
            width: 400px;
            margin: 20px auto;
        }

        /* Banner sou kote yo (Style Logo a) */
        .side-banner {
            position: absolute;
            top: 50%;
            width: 60px;
            height: 40px;
            background: #4a4a4a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            z-index: 5;
            transform: translateY(-50%);
            border-radius: 3px;
        }
        .left-b { left: 0; }
        .right-b { right: 0; }

        .roulette-container {
            position: relative;
            width: 360px;
            height: 360px;
            margin: 0 auto;
            background: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 10px solid #fff;
        }

        /* Kawotchou (Outer Wheel) */
        .wheel-outer {
            position: absolute;
            width: 330px;
            height: 330px;
            border-radius: 50%;
            background: #4a4a4a; /* Koulè kawotchou nan foto a */
            border: 8px solid #333;
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Jant Lò (Inner Wheel) */
        .wheel-inner {
            position: absolute;
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background: #b5a36d; /* Koulè lò logo a */
            border: 6px solid #4a4a4a;
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
            z-index: 2;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }

        .text-label {
            position: absolute;
            color: white;
            font-weight: bold;
            letter-spacing: 3px;
            font-size: 14px;
        }
        .top-label { top: 15px; }
        .bottom-label { bottom: 15px; }

        .bi {
            position: absolute;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #fff;
            color: #4a4a4a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            left: 50%; top: 50%;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
        }

        .bi-inner {
            width: 28px; height: 28px;
            background: #4a4a4a;
            color: #b5a36d;
            font-size: 12px;
        }

        .indicator {
            position: absolute;
            top: -10px;
            z-index: 20;
            font-size: 25px;
            color: #b5a36d;
        }

        button {
            background: #4a4a4a;
            color: #b5a36d;
            padding: 15px 30px;
            border: 3px solid #b5a36d;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <h2 style="color:#4a4a4a; margin-top: 5px;">MECHANIC SERVICE</h2>

    <div class="main-wrapper">
        <div class="side-banner left-b">20</div>
        <div class="side-banner right-b">20</div>

        <div class="roulette-container" id="roller">
            <div class="indicator">▼</div>
            
            <div class="wheel-outer" id="wheelO">
                <div class="text-label top-label">BRANDSON</div>
                <div class="text-label bottom-label">CAR SERVICE</div>
            </div>
            
            <div class="wheel-inner" id="wheelI"></div>
        </div>
    </div>

    <div class="controls">
        <input type="number" id="chwa" value="10" style="padding:10px; width:50px; text-align:center;">
        <button onclick="vireMekanik()">Lanse Kawotchou a</button>
    </div>

    <div id="status" style="margin-top:15px; font-weight:bold;">Sistèm pare pou sèvis...</div>

    <script>
        const total = 32;
        const deg = 360 / total;

        // Boul sou Kawotchou a
        for(let i = 0; i < total; i++) {
            let bi = document.createElement('div');
            bi.className = 'bi';
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 135 * Math.cos(angleRad);
            let y = 135 * Math.sin(angleRad);
            bi.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            bi.innerText = i + 1;
            document.getElementById('wheelO').appendChild(bi);
        }

        // Boul sou Jant Lò a
        for(let i = 0; i < total; i++) {
            let bi = document.createElement('div');
            bi.className = 'bi bi-inner';
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 70 * Math.cos(angleRad);
            let y = 70 * Math.sin(angleRad);
            bi.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            bi.innerText = i;
            document.getElementById('wheelI').appendChild(bi);
        }

        let rO = 0; let rI = 0;

        function vireMekanik() {
            const resO = Math.floor(Math.random() * total);
            const resI = Math.floor(Math.random() * total);

            rO += 1800 + (360 - (resO * deg));
            document.getElementById('wheelO').style.transform = `rotate(${rO}deg)`;

            setTimeout(() => {
                rI -= (1800 + (180 + (resI * deg)));
                document.getElementById('wheelI').style.transform = `rotate(${rI}deg)`;
                
                setTimeout(() => {
                    document.getElementById('status').innerHTML = 
                    `Kliyan an jwenn: <b style="color:#b5a36d">${resO + 1}</b> | Milt: <b>X${resI}</b>`;
                }, 5000);
            }, 1000);
        }
    </script>
</body>
</html>
