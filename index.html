<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Roulette Pro 32</title>
    <style>
        body {
            background: radial-gradient(circle, #021128, #000511);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
        }

        h2 {
            color: #00ff00;
            text-shadow: 0 0 15px rgba(0, 255, 0, 0.6);
            margin-bottom: 2px;
            font-size: 24px;
        }

        .roulette-container {
            position: relative;
            width: 390px;
            height: 390px;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* EGWI DEYÒ ANLO (Pou Gwo Roulette Chif yo) */
        .indicator-outer-top {
            position: absolute;
            top: 10px;
            z-index: 10;
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 24px solid #ff0055;
            filter: drop-shadow(0 0 8px #ff0055);
        }

        /* EGWI ANDEDAN ANBA (Pou Miltiplikatè Péniche yo) */
        .indicator-inner-bottom {
            position: absolute;
            bottom: 95px;
            z-index: 10;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid #00ffff;
            filter: drop-shadow(0 0 6px #00ffff);
        }

        /* Wou Deyò */
        .wheel-outer {
            position: absolute;
            width: 330px;
            height: 330px;
            border-radius: 50%;
            border: 6px solid #ffd700;
            background: #111;
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
            box-shadow: 0 0 25px rgba(241, 196, 15, 0.4);
        }

        /* Wou Mitan (Laj) */
        .wheel-inner {
            position: absolute;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            border: 5px solid #00ffff;
            background: #1a1a1a;
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
            z-index: 2;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }

        .wheel-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .number {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            left: 50%;
            top: 50%;
        }

        /* Gwo Chif Wou Deyò (Yo menm tou yo gen fòma péniche kounye a) */
        .wheel-outer .number { 
            width: 50px;
            height: 40px;
            font-weight: 900; 
            font-size: 19px; /* Yon ti kras pi piti pou ti senbòl ¢ la ka antre byen */
        }

        /* Ti Chif Miltiplikatè nan Mitan (Stil ti lajan péniche byen egui) */
        .wheel-inner .number { 
            width: 40px;
            height: 25px;
            font-weight: 700; 
            font-size: 12px; /* Byen piti ak egui */
        }

        /* Koulè Gwo Wou */
        .num-red { color: #ff3333; text-shadow: 0 0 5px #ff0000; }
        .num-black { color: #ffffff; text-shadow: 0 0 5px #000; }
        
        /* Koulè Wou Mitan (Lajan Péniche Klasik Lò ak Blan) */
        .num-classic-gold { color: #ffd700; text-shadow: 0 0 2px #000; }
        .num-classic-white { color: #f5f5f5; text-shadow: 0 0 2px #000; }
        .num-zero { color: #ff0055; text-shadow: 0 0 5px #ff0055; font-weight: 900; font-size: 13px !important; }

        .controls { margin-top: 15px; }
        input[type="number"] {
            background: #000;
            border: 2px solid #00ff00;
            color: #00ff00;
            padding: 8px;
            width: 85px;
            font-size: 18px;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
        }

        button {
            background: linear-gradient(135deg, #00ff00, #00aa00);
            border: none;
            color: black;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
            text-transform: uppercase;
            margin-top: 10px;
        }
        button:disabled { background: #444; color: #888; box-shadow: none; cursor: not-allowed; }

        .result-box {
            margin-top: 15px;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px;
            border-radius: 10px;
            display: inline-block;
            min-width: 300px;
            border: 1px solid rgba(0, 255, 0, 0.3);
        }
        .highlight { font-weight: bold; color: #00ff00; font-size: 22px; }
        .highlight-mult { font-weight: bold; color: #ffd700; font-size: 22px; }
    </style>
</head>
<body>

    <h2>EROBLACK ROULETTE PRO 32</h2>

    <div class="roulette-container">
        <div class="indicator-outer-top"></div>
        <div class="indicator-inner-bottom"></div>
        
        <!-- Wou Deyò -->
        <div class="wheel-outer" id="outerWheel">
            <div class="wheel-text" id="outerTexts"></div>
        </div>
        
        <!-- Wou Mitan -->
        <div class="wheel-inner" id="innerWheel">
            <div class="wheel-text" id="innerTexts"></div>
        </div>
    </div>

    <div class="controls">
        <label for="chwa" style="font-size: 16px;">Mize sou yon chif (1¢ - 32¢): </label>
        <input type="number" id="chwa" min="1" max="32" value="7">
        <br>
        <button id="spinBtn" onclick="vireRoulettePro()">VIRE ROULETTE LA</button>
    </div>

    <div class="result-box">
        <div id="status">Chwazi jton w lan epi klike sou bouton an! 🎲</div>
    </div>

    <script>
        const totalNimewo = 32;
        const degrePaSeksyon = 360 / totalNimewo;

        const outerTexts = document.getElementById('outerTexts');
        const innerTexts = document.getElementById('innerTexts');

        const reyonDeyo = 138;  
        const reyonAndedan = 94; 

        // Jenere Wou Deyò ak fòma péniche (¢)
        for(let i = 0; i < totalNimewo; i++) {
            let angleRad = (i * degrePaSeksyon - 90) * (Math.PI / 180); 
            let divOuter = document.createElement('div');
            divOuter.className = `number ${i % 2 === 0 ? 'num-red' : 'num-black'}`;
            // Afiche chif la tankou pyès monnen (Eg: 5¢, 7¢)
            divOuter.innerText = (i + 1) + "¢";
            
            let x = reyonDeyo * Math.cos(angleRad);
            let y = reyonDeyo * Math.sin(angleRad);
            let rotChif = i * degrePaSeksyon;
            divOuter.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${rotChif}deg)`;
            outerTexts.appendChild(divOuter);
        }

        // Jenere Wou Mitan ak fòma ti lajan péniche (¢) pi piti e egui
        for(let i = 0; i < totalNimewo; i++) {
            let angleRad = (i * degrePaSeksyon - 90) * (Math.PI / 180);
            let divInner = document.createElement('div');
            divInner.className = 'number';
            
            if (i === 0) {
                divInner.classList.add('num-zero');
            } else {
                divInner.classList.add(i % 2 === 0 ? 'num-classic-gold' : 'num-classic-white');
            }
            // Afiche miltiplikatè yo tou tankou ti lajan (Eg: 0¢, 1¢, 5¢...)
            divInner.innerText = i + "¢"; 
            
            let x = reyonAndedan * Math.cos(angleRad);
            let y = reyonAndedan * Math.sin(angleRad);
            let rotChif = i * degrePaSeksyon;
            divInner.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${rotChif}deg)`;
            innerTexts.appendChild(divInner);
        }

        let kouranDegreOuter = 0;
        let kouranDegreInner = 0;

        function sendToApp(bwat, val) {
            if (window.Android) { window.Android.voyeKòb(bwat, val.toString()); }
            if (window.SketchwareInterface) { window.SketchwareInterface.voyeKòb(bwat + ":" + val); }
        }

        function vireRoulettePro() {
            const chwaItilizate = parseInt(document.getElementById('chwa').value);
            
            if(chwaItilizate < 1 || chwaItilizate > 32 || isNaN(chwaItilizate)) {
                alert("Tanpri chwazi yon jton ant 1¢ ak 32¢!");
                return;
            }

            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            
            const endèksDeyoGayan = Math.floor(Math.random() * totalNimewo); 
            const endèksAndedanGayan = Math.floor(Math.random() * totalNimewo); 

            const chifGayan = endèksDeyoGayan + 1; 
            const miltiplikatèGayan = endèksAndedanGayan; 

            const fwaVire = 5 * 360; 

            // Wou Deyò a vire an premye
            document.getElementById('status').innerHTML = "Pyès lajan yo ap vire... 🔴";
            kouranDegreOuter += fwaVire + (360 - (endèksDeyoGayan * degrePaSeksyon));
            document.getElementById('outerWheel').style.transform = `rotate(${kouranDegreOuter}deg)`;

            // Apre gwo wou a fin kanpe
            setTimeout(() => {
                document.getElementById('status').innerHTML = `🎯 Jton ki soti: <span class="highlight">${chifGayan}¢</span>! Kounye a, miltiplikatè a ap vire... 🎰`;
                
                // Wou Mitan an vire
                kouranDegreInner -= (fwaVire + (180 + (endèksAndedanGayan * degrePaSeksyon)));
                document.getElementById('innerWheel').style.transform = `rotate(${kouranDegreInner}deg)`;

                // Rezilta final
                setTimeout(() => {
                    btn.disabled = false;
                    let teGenyen = (chwaItilizate === chifGayan);
                    let mesaj = "";

                    if (teGenyen) {
                        if (miltiplikatèGayan === 0) {
                            mesaj = `🎯 Ou jwenn jton <span class="highlight">${chifGayan}¢</span> lan! <br>Men, miltiplikatè a bay <span class="num-zero">0¢</span>... Ou fè 0X mize w. 😮`;
                            sendToApp("roulette_genyen", "0");
                        } else {
                            mesaj = `🎉 **BRAVO!** Jton: <span class="highlight">${chifGayan}¢</span> | Miltiplikatè Péniche: <span class="highlight-mult">X${miltiplikatèGayan}</span>!`;
                            sendToApp("roulette_genyen", miltiplikatèGayan);
                        }
                    } else {
                        mesaj = `😞 **Ou pèdi!** Wou a bay jton <span class="highlight" style="color:#ff3333">${chifGayan}¢</span>.<br>Miltiplikatè péniche a te soti: ${miltiplikatèGayan}¢.`;
                        sendToApp("roulette_pedi", "0");
                    }

                    document.getElementById('status').innerHTML = mesaj;
                }, 4000);

            }, 4000);
        }
    </script>
</body>
</html>
