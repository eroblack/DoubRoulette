<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pierre Lannier - Edition Précision</title>
    <style>
        :root {
            --burgundy: #6b001a;
            --sunray: radial-gradient(circle, #8a1a2d 0%, #2b0008 100%);
            --silver: #e0e0e0;
        }

        body {
            background-color: #050505;
            color: var(--silver);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .watch-body {
            position: relative;
            width: 400px;
            height: 400px; /* Kenbe dimansyon egal pou evite oval */
            background: linear-gradient(145deg, #2a2a2a, #000);
            border-radius: 50%;
            padding: 12px;
            border: 4px solid #1a1a1a;
            box-shadow: 0 50px 100px rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dial-plate {
            position: relative;
            width: 400px;
            height: 400px;
            background: var(--sunray);
            border-radius: 50%;
            overflow: hidden;
        }

        /* Egwi kout pou lizibilite */
        .needle {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            z-index: 100;
        }
        .needle-outer { top: 5px; width: 3px; height: 20px; box-shadow: 0 0 5px #fff; }
        .needle-inner { top: 90px; width: 2px; height: 15px; opacity: 0.8; }

        .result-fixed-slot {
            position: absolute;
            z-index: 110;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65px;
            height: 65px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            backdrop-filter: blur(10px);
        }

        .wheel-container {
            position: absolute;
            width: 400px;
            height: 400px;
            transition: transform 7s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .number-slot {
            position: absolute;
            left: 50%; top: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .num-white {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 300;
        }

        .text-index {
            font-size: 15px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.2);
            transition: all 0.4s ease;
        }

        .text-index.winner {
            color: #fff;
            transform: scale(1.4);
            text-shadow: 0 0 20px #fff;
        }

        button {
            margin-top: 40px;
            background: #fff;
            border: none;
            padding: 15px 60px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: 800;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="watch-body">
        <div class="needle needle-outer"></div>
        <div class="needle needle-inner"></div>
        <div class="result-fixed-slot" id="digitalDisplay">P</div>
        
        <div class="dial-plate">
            <div class="wheel-container" id="wheelO"></div>
            <div class="wheel-container" id="wheelI" style="width: 220px; height: 220px; left: 90px; top: 90px;"></div>
        </div>
    </div>

    <button onclick="spinLuxe()">Start</button>

    <script>
        const total = 32;
        const deg = 360 / total;

        // Fonksyon pou mete 0 devan si chif la pi piti pase 10
        function formatNumber(num) {
            return num < 10 ? '0' + num : num;
        }

        // Chif Deyò
        for(let i = 0; i < total; i++) {
            let el = document.createElement('div');
            el.className = 'number-slot num-white';
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 170 * Math.cos(angleRad);
            let y = 170 * Math.sin(angleRad);
            el.innerText = formatNumber(i + 1);
            el.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            document.getElementById('wheelO').appendChild(el);
        }

        // Chif Mitan (Miltiplikatè)
        for(let i = 0; i < total; i++) {
            let container = document.createElement('div');
            container.className = 'number-slot';
            let txt = document.createElement('div');
            txt.className = 'text-index';
            txt.id = 'val-' + i;
            txt.innerText = formatNumber(i);
            
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 85 * Math.cos(angleRad);
            let y = 85 * Math.sin(angleRad);
            
            container.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            container.appendChild(txt);
            document.getElementById('wheelI').appendChild(container);
        }

        let rotO = 0; let rotI = 0;

        function spinLuxe() {
            document.querySelectorAll('.text-index').forEach(t => t.classList.remove('winner'));
            document.getElementById('digitalDisplay').innerText = "••";
            
            const resO = Math.floor(Math.random() * total);
            const resI = Math.floor(Math.random() * total);

            rotO += 2520 + (360 - (resO * deg));
            document.getElementById('wheelO').style.transform = `rotate(${rotO}deg)`;

            setTimeout(() => {
                rotI -= (2520 + (180 + (resI * deg)));
                document.getElementById('wheelI').style.transform = `rotate(${rotI}deg)`;
                
                setTimeout(() => {
                    const winner = document.getElementById('val-' + resI);
                    winner.classList.add('winner');
                    document.getElementById('digitalDisplay').innerText = formatNumber(resI);
                }, 7000);
            }, 400);
        }
    </script>
</body>
</html>
