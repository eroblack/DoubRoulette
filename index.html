<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Clean Mechanic</title>
    <style>
        body {
            background: #f4f1ea;
            color: #333;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }

        .roulette-container {
            position: relative;
            width: 360px;
            height: 360px;
            margin: 40px auto;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #b5a36d;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        /* Wou Deyò (Kawotchou Nwa) */
        .wheel-outer {
            position: absolute;
            width: 330px;
            height: 330px;
            border-radius: 50%;
            background: #2b2b2b;
            border: 10px solid #1a1a1a;
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        /* Wou Mitan (Jant Lò) */
        .wheel-inner {
            position: absolute;
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background: #b5a36d;
            border: 5px solid #2b2b2b;
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
            z-index: 2;
        }

        .number {
            position: absolute;
            left: 50%;
            top: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        /* Chif blan sou wou nwa - Style Normal */
        .outer-num {
            color: #ffffff;
            font-size: 16px;
            width: 30px;
            height: 30px;
        }

        /* Chif nwa sou jant lò - Style Normal */
        .inner-num {
            color: #1a1a1a;
            font-size: 13px;
            width: 25px;
            height: 25px;
        }

        .indicator {
            position: absolute;
            top: -25px;
            z-index: 20;
            color: #2b2b2b;
            font-size: 35px;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
        }

        .controls { margin-top: 30px; }

        input {
            padding: 12px;
            border: 2px solid #b5a36d;
            background: white;
            border-radius: 8px;
            width: 60px;
            font-size: 18px;
            text-align: center;
            font-weight: bold;
        }

        button {
            background: #2b2b2b;
            color: #b5a36d;
            padding: 15px 45px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        button:active { transform: scale(0.95); }

        #status {
            margin-top: 25px;
            font-size: 18px;
            color: #2b2b2b;
            min-height: 1.5em;
        }
    </style>
</head>
<body>

    <div class="roulette-container">
        <div class="indicator">▼</div>
        <div class="wheel-outer" id="wheelO"></div>
        <div class="wheel-inner" id="wheelI"></div>
    </div>

    <div class="controls">
        <input type="number" id="chwa" value="7" min="1" max="32">
        <br>
        <button onclick="vireMekanikSwa()">VIRE ROULETTE LA</button>
    </div>

    <div id="status"></div>

    <script>
        const total = 32;
        const deg = 360 / total;

        // Jenere tout 32 chif sou wou deyò a (Dwat epi Normal)
        for(let i = 0; i < total; i++) {
            let n = document.createElement('div');
            n.className = 'number outer-num';
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 140 * Math.cos(angleRad);
            let y = 140 * Math.sin(angleRad);
            n.innerText = i + 1;
            // rotate(0deg) kenbe chif yo dwat pou je a
            n.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(0deg)`;
            document.getElementById('wheelO').appendChild(n);
        }

        // Jenere tout chif sou wou mitan an (Dwat epi Normal)
        for(let i = 0; i < total; i++) {
            let n = document.createElement('div');
            n.className = 'number inner-num';
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 75 * Math.cos(angleRad);
            let y = 75 * Math.sin(angleRad);
            n.innerText = i;
            n.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(0deg)`;
            document.getElementById('wheelI').appendChild(n);
        }

        let curO = 0; let curI = 0;

        function vireMekanikSwa() {
            const status = document.getElementById('status');
            const resO = Math.floor(Math.random() * total);
            const resI = Math.floor(Math.random() * total);

            status.innerText = "Roulette a ap vire...";

            curO += 1440 + (360 - (resO * deg));
            document.getElementById('wheelO').style.transform = `rotate(${curO}deg)`;

            setTimeout(() => {
                curI -= (1440 + (180 + (resI * deg)));
                document.getElementById('wheelI').style.transform = `rotate(${curI}deg)`;
                
                setTimeout(() => {
                    status.innerHTML = `REZILTA: <b>${resO + 1}</b> | MILTIPLIKATÈ: <b>X${resI}</b>`;
                }, 5000);
            }, 800);
        }
    </script>
</body>
</html>
