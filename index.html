<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pierre Lannier - Edition Limitée</title>
    <style>
        :root {
            --burgundy: #6b001a;
            --anthracite: #1a1a1a;
            --silver: #e0e0e0;
            --sunray: radial-gradient(circle, #8a1a2d 0%, #2b0008 100%);
        }

        body {
            background-color: #050505;
            color: var(--silver);
            font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .watch-body {
            position: relative;
            width: 400px;
            height: 400px;
            background: linear-gradient(145deg, #2a2a2a, #000);
            border-radius: 50%;
            padding: 12px;
            border: 4px solid #1a1a1a;
            box-shadow: 0 50px 100px rgba(0,0,0,0.9), inset 0 0 15px rgba(255,255,255,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dial-plate {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--sunray);
            border-radius: 50%;
            border: 1px solid #111;
            overflow: hidden;
        }

        /* Egwi Stab - Redui nan longè */
        .needle {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            z-index: 100;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        .needle-outer { top: 10px; width: 3px; height: 35px; }
        .needle-inner { top: 95px; width: 2px; height: 15px; opacity: 0.9; }

        /* Plas Fiks pou rezilta nan mitan */
        .result-fixed-slot {
            position: absolute;
            z-index: 110;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            backdrop-filter: blur(5px);
            pointer-events: none;
        }

        .wheel-container {
            position: absolute;
            width: 100%;
            height: 100%;
            transition: transform 7s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .number-slot {
            position: absolute;
            left: 50%; top: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Chif Deyò (Fine & Elegant) */
        .num-white {
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            font-weight: 300;
        }

        /* Chif Mitan (ELAJI & GRA) */
        .text-index {
            font-size: 14px; /* Ogmante font */
            font-weight: 900; /* Extra bold */
            color: rgba(255, 255, 255, 0.25);
            transition: all 0.4s ease;
        }

        .text-index.winner {
            color: #fff;
            transform: scale(1.3);
            text-shadow: 0 0 15px #fff;
        }

        button {
            margin-top: 40px;
            background: #fff;
            color: #000;
            border: none;
            padding: 14px 60px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 800;
            transition: 0.3s;
        }

        button:active { transform: scale(0.95); }

        #log {
            margin-top: 20px;
            font-size: 11px;
            letter-spacing: 4px;
            color: #444;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="watch-body">
        <div class="needle needle-outer"></div>
        <div class="needle needle-inner"></div>
        
        <div class="result-fixed-slot" id="digitalDisplay">P</div>
        
        <div class="dial-plate">
            <div class="wheel-container" id="wheelO"></div>
            <div class="wheel-container" id="wheelI" style="width: 220px; height: 220px; left: 80px; top: 80px;"></div>
        </div>
    </div>

    <button onclick="spinLuxe()">Start</button>
    <div id="log">Precision Movement</div>

    <script>
        const total = 32;
        const deg = 360 / total;

        // Jenere chif deyò yo
        for(let i = 0; i < total; i++) {
            let el = document.createElement('div');
            el.className = 'number-slot num-white';
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 165 * Math.cos(angleRad);
            let y = 165 * Math.sin(angleRad);
            el.innerText = i + 1;
            el.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            document.getElementById('wheelO').appendChild(el);
        }

        // Jenere miltiplikatè yo (Elaji ak Gra)
        for(let i = 0; i < total; i++) {
            let container = document.createElement('div');
            container.className = 'number-slot';
            let txt = document.createElement('div');
            txt.className = 'text-index';
            txt.id = 'val-' + i;
            txt.innerText = i;
            
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 85 * Math.cos(angleRad); // Elaji distans lan
            let y = 85 * Math.sin(angleRad);
            
            container.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            container.appendChild(txt);
            document.getElementById('wheelI').appendChild(container);
        }

        let rotO = 0; let rotI = 0;

        function spinLuxe() {
            document.querySelectorAll('.text-index').forEach(t => t.classList.remove('winner'));
            document.getElementById('digitalDisplay').innerText = "•";
            
            const resO = Math.floor(Math.random() * total);
            const resI = Math.floor(Math.random() * total);

            rotO += 2520 + (360 - (resO * deg));
            document.getElementById('wheelO').style.transform = `rotate(${rotO}deg)`;

            setTimeout(() => {
                rotI -= (2520 + (180 + (resI * deg)));
                document.getElementById('wheelI').style.transform = `rotate(${rotI}deg)`;
                
                setTimeout(() => {
                    const winner = document.getElementById('val-' + resI);
                    winner.classList.add('winner');
                    // Mete rezilta nan plas fiks la
                    document.getElementById('digitalDisplay').innerText = resI;
                    document.getElementById('log').innerHTML = `WINNER: ${resO + 1} | MULT: x${resI}`;
                }, 7000);
            }, 400);
        }
    </script>
</body>
</html>
