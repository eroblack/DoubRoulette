<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack iPhone Edition</title>
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-gray: #8E8E93;
            --bg-color: #f2f2f7;
        }

        body {
            background-color: var(--bg-color);
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Coque iPhone */
        .iphone-frame {
            background: #fff;
            width: 350px;
            padding: 20px;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        .dynamic-island {
            width: 100px;
            height: 25px;
            background: #000;
            border-radius: 20px;
            margin: 0 auto 20px;
        }

        .roulette-container {
            position: relative;
            width: 310px;
            height: 310px;
            margin: 20px auto;
            background: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
        }

        /* Wou Deyò (Minimalist) */
        .wheel-outer {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid #e5e5e5;
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        /* Wou Mitan (Glassmorphism) */
        .wheel-inner {
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,0,0,0.05);
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
            z-index: 2;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .number {
            position: absolute;
            left: 50%; top: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Chif Apple Style */
        .outer-num { 
            color: #1d1d1f; 
            font-size: 14px; 
            font-weight: 500;
        }
        .inner-num { 
            color: var(--ios-blue); 
            font-size: 9px; 
            font-weight: 600;
        }

        .indicator {
            position: absolute;
            top: -10px;
            z-index: 20;
            width: 4px;
            height: 20px;
            background: var(--ios-blue);
            border-radius: 2px;
        }

        /* Bouton iOS */
        .controls {
            margin-top: 30px;
        }

        input {
            border: none;
            background: #f2f2f7;
            padding: 12px;
            border-radius: 10px;
            width: 50px;
            font-size: 17px;
            margin-bottom: 15px;
            text-align: center;
        }

        button {
            background-color: var(--ios-blue);
            color: white;
            border: none;
            padding: 14px 60px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active { opacity: 0.7; }

        #status {
            margin-top: 20px;
            font-size: 15px;
            color: var(--ios-gray);
            font-weight: 400;
        }
    </style>
</head>
<body>

    <div class="iphone-frame">
        <div class="dynamic-island"></div>
        <h3 style="font-weight: 600; margin: 0;">Roulette Gold</h3>
        
        <div class="roulette-container">
            <div class="indicator"></div>
            <div class="wheel-outer" id="wheelO"></div>
            <div class="wheel-inner" id="wheelI"></div>
        </div>

        <div class="controls">
            <input type="number" id="chwa" value="7">
            <br>
            <button onclick="vireIPhone()">Spin</button>
            <div id="status">Ready to play</div>
        </div>
    </div>

    <script>
        const total = 32;
        const deg = 360 / total;

        for(let i = 0; i < total; i++) {
            let n = document.createElement('div');
            n.className = 'number outer-num';
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 130 * Math.cos(angleRad);
            let y = 130 * Math.sin(angleRad);
            n.innerText = i + 1;
            n.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(0deg)`;
            document.getElementById('wheelO').appendChild(n);
        }

        for(let i = 0; i < total; i++) {
            let n = document.createElement('div');
            n.className = 'number inner-num';
            let angleRad = (i * deg - 90) * (Math.PI / 180);
            let x = 65 * Math.cos(angleRad);
            let y = 65 * Math.sin(angleRad);
            n.innerText = i;
            n.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(0deg)`;
            document.getElementById('wheelI').appendChild(n);
        }

        let curO = 0; let curI = 0;

        function vireIPhone() {
            const resO = Math.floor(Math.random() * total);
            const resI = Math.floor(Math.random() * total);
            document.getElementById('status').innerText = "Spinning...";

            curO += 1440 + (360 - (resO * deg));
            document.getElementById('wheelO').style.transform = `rotate(${curO}deg)`;

            setTimeout(() => {
                curI -= (1440 + (180 + (resI * deg)));
                document.getElementById('wheelI').style.transform = `rotate(${curI}deg)`;
                
                setTimeout(() => {
                    document.getElementById('status').innerHTML = `Result: <b>${resO + 1}</b> • Mult: <b>x${resI}</b>`;
                }, 5000);
            }, 800);
        }
    </script>
</body>
</html>
